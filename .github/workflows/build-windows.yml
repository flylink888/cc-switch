name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - fix/opencode-live-config-sync

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows MSI and EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          '{"bundle":{"createUpdaterArtifacts":false}}' |
            Set-Content -LiteralPath tauri.local.json -Encoding utf8

          pnpm tauri build --bundles msi --config tauri.local.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/cc-switch.exe
            src-tauri/target/release/bundle/msi/*.msi
